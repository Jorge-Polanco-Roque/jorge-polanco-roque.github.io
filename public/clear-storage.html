<!DOCTYPE html>
<html>
<head>
    <title>Limpiar Storage</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #333; margin-bottom: 1rem; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            cursor: pointer;
            margin: 0.5rem;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .success { color: #10b981; font-weight: bold; margin-top: 1rem; }
        .info { color: #666; font-size: 0.9rem; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Limpiar Storage</h1>
        <p>Si la aplicación no carga correctamente, limpia el storage del navegador.</p>

        <button onclick="clearStorage()">🗑️ Limpiar Todo</button>
        <button onclick="goHome()">🏠 Ir a la App</button>

        <div id="message"></div>
        <div class="info">
            <p><strong>Esto limpiará:</strong></p>
            <ul style="text-align: left; display: inline-block;">
                <li>localStorage (datos de productos, ventas, clientes)</li>
                <li>sessionStorage</li>
                <li>IndexedDB</li>
                <li>Cookies</li>
                <li>Cache</li>
            </ul>
        </div>
    </div>

    <script>
        function clearStorage() {
            try {
                // Clear localStorage
                localStorage.clear();

                // Clear sessionStorage
                sessionStorage.clear();

                // Clear cookies
                document.cookie.split(";").forEach(function(c) {
                    document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
                });

                // Clear IndexedDB
                if (window.indexedDB) {
                    indexedDB.databases().then(dbs => {
                        dbs.forEach(db => {
                            indexedDB.deleteDatabase(db.name);
                        });
                    });
                }

                // Clear cache
                if ('caches' in window) {
                    caches.keys().then(names => {
                        names.forEach(name => {
                            caches.delete(name);
                        });
                    });
                }

                document.getElementById('message').innerHTML = '<div class="success">✅ Storage limpiado exitosamente! Redirigiendo...</div>';

                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } catch (error) {
                document.getElementById('message').innerHTML = '<div style="color: red;">❌ Error: ' + error.message + '</div>';
            }
        }

        function goHome() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
